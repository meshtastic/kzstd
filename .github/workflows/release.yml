name: Release

# Dispatch from main with the version a merged release PR set, or push its tag.
# A dispatch pushes the tag only after every gate, so a refused dispatch leaves no tag.
# A pushed tag runs the same gates but already exists, and the org forbids deleting tags,
# so a refused pushed tag is spent: fix the cause and release the next patch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 (must match VERSION)'
        required: true
        type: string
      dry_run:
        description: 'Run every gate and stage the artifacts, but tag, publish and release nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  release:
    name: Gate, publish to Maven Central & release
    # macOS, because the Toolchain builds Apple targets only on a Mac: on Linux `./kotlin build`
    # skips them, and the publication would lack the Apple artifacts.
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
      statuses: read
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          # A dispatch takes the bare version so the concurrency group above is canonical.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${REQUESTED#v}" != "$REQUESTED" ]; then
            echo "::error::pass the version without a leading v: ${REQUESTED#v}"
            exit 1
          fi
          echo "version=${REQUESTED#v}" >> "$GITHUB_OUTPUT"

      - name: Release from main only
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF is not on main; release from main (dry_run may run anywhere)"
            exit 1
          fi

      - name: Verify the version sources agree
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          VF=$(tr -d '[:space:]' < VERSION)
          VM=$(yq -r '.settings.publishing.version' kzstd/module.yaml | tr -d '[:space:]')
          if [ "$V" != "$VF" ] || [ "$V" != "$VM" ]; then
            echo "::error::releasing $V, but VERSION is $VF and kzstd/module.yaml is $VM"
            exit 1
          fi
          git fetch --quiet origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || true
          if git rev-parse --quiet --verify "v$V^{commit}" >/dev/null &&
             [ "$(git rev-parse "v$V^{commit}")" != "$(git rev-parse HEAD)" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::v$V already exists on another commit; a real release would stop here"
            else
              echo "::error::v$V already exists on another commit"
              exit 1
            fi
          fi
          echo "releasing $V from $(git rev-parse --short HEAD)"

      - name: Render release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(scripts/changelog.sh notes "$V")
          cat > release-notes.md <<EOF
          Pure-Kotlin multiplatform Zstandard (zstd) codec with dictionary support,
          interoperable with libzstd, zero runtime dependencies.

          \`\`\`kotlin
          implementation("org.meshtastic:kzstd:${V}")
          \`\`\`

          ${NOTES}
          EOF
          cat release-notes.md

      # CI does not run on tags, so the Apple tests this runner cannot execute are only
      # guaranteed by the required checks having passed on this exact commit.
      - name: Require green CI on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-checks.sh green-ci "$(git rev-parse HEAD)"

      - name: Point the toolchain caches at one directory
        run: |
          {
            echo "KOTLIN_CLI_BOOTSTRAP_CACHE_DIR=$HOME/kotlin-cache/cli"
            echo "KOTLIN_SHARED_CACHE_DIR=$HOME/kotlin-cache/shared"
            echo "MAVEN_LOCAL=$RUNNER_TEMP/m2"
          } >> "$GITHUB_ENV"

      - name: Cache the Kotlin Toolchain and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kotlin-cache
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'gradle/libs.versions.toml', 'kzstd/module.yaml', 'abitool/module.yaml', 'project.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Build every module
        run: ./kotlin build

      - name: Test (JVM, Wasm, macOS)
        run: ./kotlin test -m kzstd -p jvm -p wasmJs -p macosArm64

      # The Toolchain never signs a Maven Local publication; signing happens on the Central upload.
      - name: Stage artifacts locally
        run: |
          KOTLIN_CLI_JAVA_OPTIONS="-Dmaven.repo.local=$MAVEN_LOCAL" ./kotlin publish mavenLocal

      - name: Refuse a -SNAPSHOT dependency
        run: scripts/release-checks.sh no-snapshots "${{ steps.version.outputs.version }}"

      - name: Collect every staged artifact for attestation
        run: |
          mkdir -p maven-attestation
          find "$MAVEN_LOCAL/org/meshtastic" -path "*/${{ steps.version.outputs.version }}/*" -type f \
            \( -name '*.jar' -o -name '*.klib' -o -name '*.pom' -o -name '*.module' \) \
            -exec cp {} maven-attestation/ \;
          ls -1 maven-attestation

      - name: Attest the staged artifacts
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: maven-attestation/*

      - name: Check Maven Central state
        # Sonatype rejects a re-upload, so a re-run after a partial release skips the publish.
        id: central
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # Only a 404 means unpublished; anything else stops the release rather than guess.
          for _ in 1 2 3 4 5; do
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/org/meshtastic/kzstd-jvm/$V/kzstd-jvm-$V.pom" || echo 000)
            echo "Maven Central POM probe for $V: HTTP $HTTP"
            case "$HTTP" in
              200) echo "published=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              404) echo "published=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Maven Central did not answer 200 or 404 for $V"
          exit 1

      - name: Push the release tag
        if: env.DRY_RUN != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --quiet --verify "v$V" >/dev/null; then
            echo "v$V already on origin"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"

      # publishingMode is manual: the upload waits in the Central Portal to be released by hand.
      - name: Publish to Maven Central
        if: env.DRY_RUN != 'true' && steps.central.outputs.published != 'true'
        env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./kotlin publish mavenCentral

      - name: Create or update the GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: echo "dry run passed every gate for ${{ steps.version.outputs.version }}; nothing was tagged, published or released"
